artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  dataset_name: knkarthick/samsum
  revision: 6b929ff10edec703164e3ddb2e94aae058c9ab5f
  output_dir: artifacts/data_ingestion/samsum_dataset

data_validation:
  root_dir: artifacts/data_validation
  data_dir: artifacts/data_ingestion/samsum_dataset
  status_file: artifacts/data_validation/status.txt
  required_columns: [id, dialogue, summary]
  expected_rows: {train: 14731, validation: 818, test: 819}

data_transformation:
  root_dir: artifacts/data_transformation
  data_dir: artifacts/data_ingestion/samsum_dataset
  output_dir: artifacts/data_transformation/samsum_dataset
  tokenizer_name: google/pegasus-cnn_dailymail

model_trainer:
  root_dir: artifacts/model_trainer
  data_dir: artifacts/data_transformation/samsum_dataset
  status_file: artifacts/data_validation/status.txt
  base_model: google/pegasus-cnn_dailymail
  checkpoints_dir: artifacts/model_trainer/checkpoints
  model_dir: artifacts/model_trainer/model
  metrics_file: artifacts/model_trainer/train_metrics.json

model_evaluation:
  root_dir: artifacts/model_evaluation
  data_dir: artifacts/data_transformation/samsum_dataset
  base_model: google/pegasus-cnn_dailymail
  model_dir: artifacts/model_trainer/model
  metrics_file: artifacts/model_evaluation/metrics.json
  examples_file: artifacts/model_evaluation/examples.md

publish:
  model_dir: artifacts/model_trainer/model
  metrics_file: artifacts/model_evaluation/metrics.json
  repo_id: tapankhaladkar/pegasus-samsum
  private: false
